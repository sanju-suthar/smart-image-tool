name: Build Smart Image Tool APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android project, Inject Native APK Compression Engine & App Icon
        run: |
          # Backup your uploaded pubspec.yaml and lib/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          cp lib/main.dart /tmp/main.dart

          # Scaffold missing android/ folders automatically
          flutter create --platforms=android --org com.smartimagetool --project-name smart_image_tool .

          # Restore your custom pubspec.yaml and lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml
          cp /tmp/main.dart lib/main.dart

          # Set display name to "Smart Image Tool" in AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="Smart Image Tool"/g' android/app/src/main/AndroidManifest.xml

          # Inject the exact Native Android Bitmap.compress & BitmapFactory.Options (B0 & c1) code from base.apk into MainActivity.kt
          MAIN_KT=$(find android/app/src/main/kotlin -name "MainActivity.kt" | head -n 1)
          if [ -n "$MAIN_KT" ]; then
            PKG_LINE=$(head -n 1 "$MAIN_KT")
            cat << 'KOTLIN_EOF' > "$MAIN_KT"
package com.smartimagetool.smart_image_tool

import android.graphics.Bitmap
import android.graphics.BitmapFactory
import android.graphics.Matrix
import android.media.ExifInterface
import io.flutter.embedding.android.FlutterActivity
import io.flutter.embedding.engine.FlutterEngine
import io.flutter.plugin.common.MethodChannel
import java.io.File
import java.io.FileOutputStream
import kotlin.math.ln
import kotlin.math.max
import kotlin.math.pow
import kotlin.math.roundToLong

class MainActivity : FlutterActivity() {
    private val CHANNEL = "com.smartimagetool/apk_compressor"

    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
        super.configureFlutterEngine(flutterEngine)
        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
            if (call.method == "compressImage") {
                val inputPath = call.argument<String>("inputPath") ?: ""
                val outputPath = call.argument<String>("outputPath") ?: ""
                val useQualitySlider = call.argument<Boolean>("useQualitySlider") ?: false
                val sliderQuality = call.argument<Int>("sliderQuality") ?: 80
                val targetBytes = call.argument<Double>("targetBytes") ?: 50000.0

                Thread {
                    try {
                        val res = runApkCompression(inputPath, outputPath, useQualitySlider, sliderQuality, targetBytes)
                        runOnUiThread { result.success(res) }
                    } catch (e: Exception) {
                        runOnUiThread { result.error("COMPRESS_ERR", e.message, null) }
                    }
                }.start()
            } else {
                result.notImplemented()
            }
        }
    }

    // Exact port of com.mobso.photoreducer.lite.MainActivity.S0(Bitmap, float) & Q0(Uri)
    private fun fixExifOrientation(bitmap: Bitmap, path: String): Bitmap {
        return try {
            val exif = ExifInterface(path)
            val orientation = exif.getAttributeInt(ExifInterface.TAG_ORIENTATION, ExifInterface.ORIENTATION_NORMAL)
            val angle = when (orientation) {
                ExifInterface.ORIENTATION_ROTATE_90 -> 90f
                ExifInterface.ORIENTATION_ROTATE_180 -> 180f
                ExifInterface.ORIENTATION_ROTATE_270 -> 270f
                else -> 0f
            }
            if (angle == 0f) bitmap else {
                val matrix = Matrix()
                matrix.postRotate(angle)
                Bitmap.createBitmap(bitmap, 0, 0, bitmap.width, bitmap.height, matrix, true)
            }
        } catch (e: Exception) {
            bitmap
        }
    }

    // Exact port of com.mobso.photoreducer.lite.MainActivity.B0(Uri)
    private fun decodeSubsampledBitmapB0(path: String): Bitmap {
        val boundsOpts = BitmapFactory.Options().apply { inJustDecodeBounds = true }
        BitmapFactory.decodeFile(path, boundsOpts)
        var inSampleSize = 1
        if (boundsOpts.outHeight > 750 || boundsOpts.outWidth > 750) {
            val maxDim = max(boundsOpts.outHeight, boundsOpts.outWidth).toDouble()
            val exp = (ln(750.0 / maxDim) / ln(0.5)).roundToLong().toDouble()
            inSampleSize = 2.0.pow(exp).toInt().coerceAtLeast(1)
        }
        val decodeOpts = BitmapFactory.Options().apply { this.inSampleSize = inSampleSize }
        val bmp = BitmapFactory.decodeFile(path, decodeOpts)
        return fixExifOrientation(bmp, path)
    }

    // Exact port of com.mobso.photoreducer.lite.MainActivity.c1(String, int)
    private fun compressToFileC1(bitmap: Bitmap, filePath: String, quality: Int) {
        FileOutputStream(filePath).use { fos ->
            bitmap.compress(Bitmap.CompressFormat.JPEG, quality.coerceIn(1, 100), fos)
            fos.flush()
        }
    }

    // Exact port of MainActivity$t (slider mode) and MainActivity$h / MainActivity$i (target KB/MB mode)
    private fun runApkCompression(
        inputPath: String,
        outputPath: String,
        useQualitySlider: Boolean,
        sliderQuality: Int,
        targetBytes: Double
    ): Map<String, Any> {
        val origFile = File(inputPath)
        val origLength = origFile.length()

        if (useQualitySlider) {
            val rawBmp = BitmapFactory.decodeFile(inputPath) ?: throw Exception("Failed to decode image")
            val bmp = fixExifOrientation(rawBmp, inputPath)
            val q = sliderQuality.coerceIn(1, 100)
            compressToFileC1(bmp, outputPath, q)
            val outFile = File(outputPath)
            return mapOf(
                "success" to true,
                "outputPath" to outputPath,
                "finalSize" to outFile.length(),
                "finalQuality" to q,
                "downsampled" to false,
                "width" to bmp.width,
                "height" to bmp.height
            )
        }

        // Target File Size Mode: Pass 1 (a0 = true, full resolution), Pass 2 (a0 = false, B0 750px sub-sampled)
        for (pass in 0..1) {
            val a0 = (pass == 0)
            val bitmap: Bitmap = try {
                if (a0) {
                    val raw = BitmapFactory.decodeFile(inputPath) ?: decodeSubsampledBitmapB0(inputPath)
                    fixExifOrientation(raw, inputPath)
                } else {
                    decodeSubsampledBitmapB0(inputPath)
                }
            } catch (e: OutOfMemoryError) {
                decodeSubsampledBitmapB0(inputPath)
            }

            var quality = 100
            val minQuality = 4 // MainActivity.f = 4, MainActivity.m = 4
            compressToFileC1(bitmap, outputPath, quality)
            val outFile = File(outputPath)
            val q100Length = outFile.length()

            var achieved = false
            if ((origLength + 1).toDouble() <= targetBytes && (q100Length + 1).toDouble() <= targetBytes) {
                achieved = true
            } else {
                var looping = true
                while (looping) {
                    val currentLen = outFile.length()
                    if ((currentLen + 1).toDouble() > targetBytes) {
                        achieved = false
                        outFile.delete()
                        if (quality > minQuality) {
                            quality = when {
                                quality > 70 -> quality - 1
                                quality > 45 -> quality - 2
                                else -> quality - 3
                            }
                            compressToFileC1(bitmap, outputPath, quality)
                        } else {
                            quality = minQuality
                            compressToFileC1(bitmap, outputPath, quality)
                            looping = false
                        }
                    } else {
                        achieved = true
                        looping = false
                    }
                }
            }

            if (achieved && outFile.exists() && outFile.length() > 0) {
                return mapOf(
                    "success" to true,
                    "outputPath" to outputPath,
                    "finalSize" to outFile.length(),
                    "finalQuality" to quality,
                    "downsampled" to !a0,
                    "width" to bitmap.width,
                    "height" to bitmap.height
                )
            }
        }

        val finalFile = File(outputPath)
        return mapOf(
            "success" to true,
            "outputPath" to outputPath,
            "finalSize" to finalFile.length(),
            "finalQuality" to 4,
            "downsampled" to true,
            "width" to 0,
            "height" to 0
        )
    }
}
KOTLIN_EOF
            sed -i "1s|.*|$PKG_LINE|" "$MAIN_KT"
          fi

          # Create Purple Minimal Camera & Resize App Icon automatically if assets/icon.png is not uploaded
          mkdir -p assets
          if [ ! -f assets/icon.png ]; then
            python3 - << 'PY_EOF'
import os, struct, zlib

def create_purple_camera_resize_icon(filename, size=512):
    raw_data = bytearray()
    center = size / 2.0
    for y in range(size):
        raw_data.append(0)
        for x in range(size):
            t = (x + y) / (2.0 * size)
            r = int(142 * (1 - t) + 49 * t)
            g = int(36 * (1 - t) + 27 * t)
            b = int(170 * (1 - t) + 146 * t)

            dx = x - center
            dy = y - center
            dist = (dx*dx + dy*dy) ** 0.5

            is_white = False
            if 105 <= dist <= 125:
                is_white = True
            elif 65 <= dist <= 80:
                is_white = True
            elif dist <= 22:
                is_white = True

            margin = 95
            arm = 70
            thick = 18
            if (margin <= x <= margin + arm and margin <= y <= margin + thick) or \
               (margin <= x <= margin + thick and margin <= y <= margin + arm):
                is_white = True
            if (size - margin - arm <= x <= size - margin and margin <= y <= margin + thick) or \
               (size - margin - thick <= x <= size - margin and margin <= y <= margin + arm):
                is_white = True
            if (margin <= x <= margin + arm and size - margin - thick <= y <= size - margin) or \
               (margin <= x <= margin + thick and size - margin - arm <= y <= size - margin):
                is_white = True
            if (size - margin - arm <= x <= size - margin and size - margin - thick <= y <= size - margin) or \
               (size - margin - thick <= x <= size - margin and size - margin - arm <= y <= size - margin):
                is_white = True

            if is_white:
                raw_data.extend((255, 255, 255, 255))
            else:
                raw_data.extend((r, g, b, 255))

    def png_chunk(chunk_type, data):
        return struct.pack(">I", len(data)) + chunk_type + data + struct.pack(">I", zlib.crc32(chunk_type + data) & 0xffffffff)

    ihdr = struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0)
    idat = zlib.compress(bytes(raw_data), 9)
    with open(filename, "wb") as f:
        f.write(b"\x89PNG\r\n\x1a\n")
        f.write(png_chunk(b"IHDR", ihdr))
        f.write(png_chunk(b"IDAT", idat))
        f.write(png_chunk(b"IEND", b""))

create_purple_camera_resize_icon("assets/icon.png", 512)
PY_EOF
          fi

      - name: Install dependencies & Apply Launcher Icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build Release APK for Realme 6
        run: flutter build apk --release --split-per-abi

      - name: Upload Smart Image Tool APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Image-Tool-APK
          path: build/app/outputs/flutter-apk/*.apk
