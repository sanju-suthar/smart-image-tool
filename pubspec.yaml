name: smart_image_tool
description: A clean Material 3 utility app for Realme 6 to compress, increase size, resize, and crop images in JPG format using the exact native Android Bitmap.compress & BitmapFactory algorithm.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  image: ^4.2.0
  crop_your_image: ^1.1.0
  gal: ^2.3.0
  share_plus: ^10.0.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#4A148C"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
